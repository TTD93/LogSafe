name: Ruby

on:
  push: # every branch, so a branch is tested before there is a pull request for it
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # A pull request from a branch of this repository was already tested when the branch was pushed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.10'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Specs and RuboCop
        run: bundle exec rake
      # The same specs again, plus the ones that need Docker: Vector, and stand-ins for S3 and Google Cloud Storage.
      - name: End to end, with Docker
        run: shipper/test
